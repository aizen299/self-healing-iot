# Local stack: broker, gateway, and a fleet.
#
# Memory limits are set on every service, and deliberately. The host has 8 GB
# (ADR-003) and Docker's VM already claims about half of it, so a stack that
# quietly grew past its share would push the host into swap — and Phase 8
# measures gateway memory on this machine. An unbounded container would make
# those numbers a property of whatever else happened to be running.
#
#   docker compose up --build              the whole stack, running until stopped
#   docker compose up broker gateway       just the pipeline, no Kafka, no devices
#
# Kafka is the heaviest service here by a wide margin. Leave it out unless the
# phase under test needs it: the gateway runs without it and says so.
#   docker compose up --scale fleet=3      three independent fleets
#   docker compose --profile monitoring up  the stack plus Prometheus and Grafana
#   ./infrastructure/docker/smoke-test.sh  build and verify without leaving one up
#
# The gateway is published on 18080, not 8080: Jenkins already holds 8080 on
# this machine, and Docker's 0.0.0.0 bind loses to its 127.0.0.1 bind — so the
# stack reports itself healthy while anything querying the host reaches
# Jenkins and gets a 403.

name: self-healing-fleet

# Heartbeats ride the telemetry tick (ADR-006), so the gateway's expected
# interval and the fleet's publish interval must be the same number. Compose
# is the first artefact that configures both halves together, so the coupling
# is expressed once here instead of as two literals and a hopeful comment.
x-tick-interval-ms: &tick "1000"

services:
  broker:
    # eclipse-mosquitto:2 — pinned by digest for the same reason as the JDK.
    image: eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: fleet-broker
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    mem_limit: 128m
    healthcheck:
      # Publishing proves the broker accepts traffic; a port check would only
      # prove something is listening.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok -q 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  # Single-node Kafka in KRaft mode — no ZooKeeper, one JVM instead of two,
  # which matters on a host that has 8 GB and is already running a Docker VM.
  #
  # Replication factor 1 everywhere. That is wrong for production and right
  # here: there is one broker, so asking for more would simply fail to create
  # the topics.
  kafka:
    # apache/kafka:3.9.0 — pinned by digest, like every other base image.
    image: apache/kafka@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    container_name: fleet-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Empty host, not 0.0.0.0. The image runs a storage-format step before
      # the broker starts, and that step rejects the literal 0.0.0.0 as a
      # non-routable advertised address even when advertised.listeners is set
      # separately. An empty host binds every interface without tripping it.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertised as the compose service name: in-cluster clients resolve
      # "kafka", and a host client would need a second listener rather than
      # this one rewritten.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Kafka defaults to a heap sized from the host's memory, which inside a
      # container means it ignores the limit below and gets OOM-killed.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      # Listing topics proves the broker is serving the API, not merely that
      # the JVM has a socket open.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: gateway
    container_name: fleet-gateway
    depends_on:
      broker:
        condition: service_healthy
    # Deliberately does NOT depend on kafka. Forwarding is a runtime flag, not
    # a startup requirement, and a depends_on here would drag the heaviest
    # service in the stack into `docker compose up broker gateway` — the path
    # three documents call the light one.
    ports:
      - "18080:8080"
    environment:
      MQTT_BROKER_URL: tcp://broker:1883
      GATEWAY_CLIENT_ID: fleet-gateway
      GATEWAY_HTTP_PORT: "8080"
      GATEWAY_HEARTBEAT_INTERVAL_MS: *tick
      GATEWAY_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      # Mounted at the path StoreConfig already defaults to under /app, so the
      # path is defined once rather than in both the image and here.
      - gateway-data:/app/data
    mem_limit: 512m
    # Longer than the application's own 10-second shutdown grace. At the
    # default the two race, and losing means the process is killed mid-shutdown.
    stop_grace_period: 30s
    restart: unless-stopped

  # Derives fleet-level statistics from telemetry.raw. Separate from the
  # gateway on purpose: the gateway detects failures, and putting a Kafka
  # consumer's lag between a device failing and anybody noticing would be
  # exactly the wrong dependency. Nothing here is on the detection path.
  stream-processor:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: stream-processor
    container_name: fleet-stream-processor
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_APPLICATION_ID: fleet-stream-processor
      STREAM_WINDOW_SECONDS: "10"
    mem_limit: 512m
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      # Every other long-running service reports its own health. Without this
      # a topology that cannot start — a serde mismatch, an unreachable broker
      # — crash-loops while compose reports it simply Up, and nothing consumes
      # telemetry.processed yet to notice the silence.
      test: ["CMD-SHELL", "test -f /app/data/streams-state && grep -q RUNNING /app/data/streams-state"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # The fleet.
  #
  # One container runs the whole fleet rather than one per device: ADR-003
  # scopes the simulation to a shared-JVM harness because 50 JVMs do not fit
  # in this host's memory, and that does not change inside a container.
  # Per-device containers arrive with Kubernetes, at a smaller device count,
  # for the recovery demonstration.
  #
  # No container_name, so `--scale fleet=N` works — Docker refuses to scale a
  # service with a fixed name.
  fleet:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: edge-device
    depends_on:
      broker:
        condition: service_healthy
    environment:
      FLEET_SINK: mqtt
      MQTT_BROKER_URL: tcp://broker:1883
      FLEET_DEVICE_COUNT: "10"
      FLEET_PUBLISH_INTERVAL_MS: *tick
      # Deliberately long rather than a timed run. A fleet that exits partway
      # through `docker compose up` looks exactly like the failure this system
      # detects — the gateway would dutifully declare every device down, and
      # nothing on screen would distinguish that from a bug. Stop it with
      # `docker compose down`.
      FLEET_RUN_DURATION_SECONDS: "86400"
      FLEET_VARIANT: constrained
      # The heap cap is Pillar A's independent variable, so it is stated here
      # rather than defaulted in the image.
      JAVA_OPTS: "-Xmx64m"
    mem_limit: 256m
    # Each device publishes retained SHUTDOWN and a real DISCONNECT on the way
    # out. If that is cut short the broker fires ten Last Wills instead and the
    # gateway reads a deliberate stop as a fleet-wide failure — the exact
    # confusion ADR-006 split SHUTDOWN from OFFLINE to prevent.
    stop_grace_period: 30s
    restart: "no"

  # Prometheus and Grafana, behind a profile so they do not start with a plain
  # `docker compose up`.
  #
  # A profile and not just "leave them out of the command line", which is how
  # Kafka is handled a few services up. The two are about 1.1 GB of image
  # between them — Grafana alone is larger than Kafka — and unlike Kafka they
  # are not something a later phase's tests will want by default. Kafka
  # predates this and could reasonably get the same treatment; changing it now
  # would break commands three other documents give.
  prometheus:
    # prom/prometheus:v3.1.0 — pinned by digest, like everything else here.
    image: prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    container_name: fleet-prometheus
    profiles: ["monitoring"]
    depends_on:
      - gateway
    ports:
      # 19090, matching the kind mapping, so one number works either way.
      - "19090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Six hours. This is a demonstration surface, not the system of record —
      # experiments/results/ is where a number that matters gets written down.
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    # grafana/grafana:11.5.1 — pinned by digest.
    image: grafana/grafana@sha256:5781759b3d27734d4d548fcbaf60b1180dbf4290e708f01f292faa6ae764c5e6
    container_name: fleet-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      # 13000 rather than 3000, matching the kind mapping.
      - "13000:3000"
    environment:
      # Anonymous, with the Admin role. A laptop demonstration behind a
      # published port; a login screen would cost a step and buy nothing. Not
      # a pattern to copy anywhere real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Read-only mounts of the same files the Kubernetes overlay puts in
      # ConfigMaps. The dashboard has one copy in this repository and both
      # deployments read it.
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped

volumes:
  # Named rather than a bind mount: the history survives a rebuild, and the
  # container's non-root user owns it without fighting host permissions.
  gateway-data:
  prometheus-data:
  grafana-data:
