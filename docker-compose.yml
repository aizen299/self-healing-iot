# Local stack: broker, gateway, and a fleet.
#
# Memory limits are set on every service, and deliberately. The host has 8 GB
# (ADR-003) and Docker's VM already claims about half of it, so a stack that
# quietly grew past its share would push the host into swap — and Phase 8
# measures gateway memory on this machine. An unbounded container would make
# those numbers a property of whatever else happened to be running.
#
#   docker compose up --build           the whole stack
#   docker compose up broker gateway    just the pipeline, no devices

name: self-healing-fleet

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: fleet-broker
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    mem_limit: 128m
    healthcheck:
      # Publishing proves the broker accepts traffic; a port check would only
      # prove something is listening.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok -q 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    container_name: fleet-gateway
    depends_on:
      broker:
        condition: service_healthy
    ports:
      # 18080 on the host, not 8080. Port 8080 is the most contended port on a
      # developer machine — this one was already taken by an unrelated Jetty
      # app, and Docker's 0.0.0.0 bind silently lost to its 127.0.0.1 bind, so
      # the stack looked healthy while the host reached someone else's server.
      # The container keeps 8080; only the published port moves.
      - "18080:8080"
    environment:
      MQTT_BROKER_URL: tcp://broker:1883
      GATEWAY_CLIENT_ID: fleet-gateway
      GATEWAY_HTTP_PORT: "8080"
      # Must match the fleet's publish interval, because heartbeats ride the
      # telemetry tick (ADR-006). Compose is the one place both halves are
      # visible together, so the coupling is at least obvious here.
      GATEWAY_HEARTBEAT_INTERVAL_MS: "1000"
      GATEWAY_STORE_PATH: /app/data/fleet
    volumes:
      - gateway-data:/app/data
    mem_limit: 512m
    restart: unless-stopped

  # The fleet. Scale it with:  docker compose up --scale fleet=1
  #
  # One container runs the whole fleet rather than one container per device:
  # ADR-003 scopes the simulation to a shared-JVM harness precisely because
  # 50 JVMs do not fit in this host's memory. Per-device containers arrive in
  # the Kubernetes phase, at a much smaller device count, for the recovery
  # demonstration.
  fleet:
    build:
      context: .
      dockerfile: infrastructure/docker/edge-device.Dockerfile
    container_name: fleet-devices
    depends_on:
      broker:
        condition: service_healthy
    environment:
      FLEET_SINK: mqtt
      MQTT_BROKER_URL: tcp://broker:1883
      FLEET_DEVICE_COUNT: "10"
      FLEET_PUBLISH_INTERVAL_MS: "1000"
      FLEET_RUN_DURATION_SECONDS: "120"
      FLEET_VARIANT: constrained
      # The heap cap is Pillar A's independent variable, so it is stated here
      # rather than defaulted in the image.
      JAVA_OPTS: "-Xmx64m"
    mem_limit: 256m
    restart: "no"

volumes:
  # Named rather than a bind mount: the history survives a rebuild, and the
  # container's non-root user owns it without fighting host permissions.
  gateway-data:
