# The gate every change passes, and the only thing that publishes an image.
#
# What this pipeline is for, in one line: it runs the tests against a real
# broker and refuses to call a run green unless the whole suite actually ran.
# The MQTT suites skip themselves when no broker is listening, and a skipped
# test reports success — so the interesting failure here is not a red build,
# it is a green one that measured nothing. See ADR-014.
name: CI

# Pull requests are the gate. A version tag is the only trigger that
# publishes, and it publishes nothing that has not passed the gate first.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Superseded pull-request runs are cancelled. Runs on main and on tags are
# not: those are the ones whose result something downstream depends on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The tests already default to this. Stating it makes the broker this
      # workflow starts and the broker the tests look for one decision
      # instead of two that have to agree.
      MQTT_BROKER_URL: tcp://127.0.0.1:1883
    steps:
      # Actions are pinned to a commit SHA, not a tag, for the reason the
      # Dockerfile pins its base images by digest: a tag moves, and a gate
      # that can change under you is not a gate. The tag each SHA stood for
      # when it was pinned is in the comment above it.
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned JDK
        # actions/setup-java v6.0.0
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          # Temurin 21, matching ADR-002 and the eclipse-temurin base images.
          # The enforcer rejects anything else, GraalVM included, so this is
          # the JDK the build will accept rather than merely prefer.
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the broker
        # compose, not a service container. The broker's configuration lives
        # in this repository — anonymous access on, persistence off so
        # retained presence cannot survive into the next run (ADR-004) — and
        # a service container starts before the checkout that would supply
        # that file. This is the same image, at the same pinned digest, with
        # the same config as `docker compose up`.
        run: docker compose up -d --wait broker

      - name: Build and test
        # verify, not test: the images copy target/dependency, which the
        # dependency plugin writes at the package phase. Stopping at `test`
        # would leave that step for the image job to discover.
        run: mvn -B verify

      - name: Assert the suite ran complete
        # The point of the job. `mvn` exits 0 on a skipped test; this does not.
        run: python3 .github/scripts/assert-suite-complete.py

      - name: Keep the test reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Broker logs
        # A build that failed because the broker did not come up looks, from
        # the Maven output alone, like a fleet of connection timeouts.
        if: failure()
        run: docker compose logs broker

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ShellCheck
        # Pinned by digest, like everything else here, so the gate cannot
        # tighten on its own the day a new shellcheck ships a new warning.
        #
        # `--severity=style` is the strictest setting, and that is deliberate.
        # The scripts in this repository are the experiment apparatus: Phase
        # 11 discarded two runs over their bugs, one of them a pair of
        # backticks inside an unquoted heredoc, which shellcheck reports as
        # SC2006. A shell bug in the apparatus does not announce itself the
        # way a failing test does.
        run: |
          # Every tracked *.sh, plus any tracked file whose first line is a
          # shell shebang. Matching on the extension alone would let a script
          # without one skip the check that exists for scripts.
          scripts=()
          while IFS= read -r -d '' f; do
            case "$f" in *.sh) scripts+=("$f"); continue ;; esac
            [ -f "$f" ] || continue
            IFS= read -r first < "$f" || true
            case "$first" in '#!'*sh|'#!'*sh[[:space:]]*) scripts+=("$f") ;; esac
          done < <(git ls-files -z)

          [ ${#scripts[@]} -gt 0 ] || {
            echo "found no shell scripts to check, which is itself wrong" >&2
            exit 1
          }
          echo "checking ${#scripts[@]}: ${scripts[*]}"

          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine@sha256:c82fe42504fbc9fc68f15d36638e5ee2324ebb8b94e96a3c4e395bf361c49183 \
            shellcheck --severity=style --format=gcc "${scripts[@]}"

      - name: actionlint
        # The workflow's own shell was the one shell in the repository nothing
        # checked — including the publish job's loop, the only code here that
        # handles a credential. actionlint runs shellcheck over every `run:`
        # block and validates the expressions and action references besides.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: The gate's own tests
        # assert-suite-complete.py decides whether a build counts, so a
        # regression in it is invisible by construction: the symptom is a
        # green run. Its fixtures live in the script and need no build.
        run: python3 .github/scripts/assert-suite-complete.py --self-test

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate against the Kubernetes schemas
        # Nothing else in this pipeline reads these files: the images job
        # builds containers and runs compose, so a manifest typo — a bad
        # indent, a renamed ConfigMap key, a selector that no longer matches
        # what the operator looks for — surfaced only when someone ran
        # deploy.sh, which is also the moment an experiment was about to start.
        #
        # -ignore-missing-schemas covers the types with no published schema:
        # kind's Cluster, and Argo CD's Application and AppProject. Those are
        # parsed as YAML and checked by `kubectl apply` at bootstrap, but they
        # are not schema-validated here — worth knowing before trusting a
        # green run on a typo inside an Application spec.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/yannh/kubeconform@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f \
            -strict -summary -ignore-missing-schemas \
            infrastructure/kubernetes infrastructure/gitops

      - name: Parse the Grafana dashboard
        # deploy.sh builds a ConfigMap out of this file, and it is the only
        # copy of the dashboard. Malformed JSON here means monitoring comes up
        # empty with the rest of the deploy reporting success.
        run: |
          python3 -m json.tool --sort-keys \
            infrastructure/monitoring/grafana/dashboards/fleet.json > /dev/null
          echo "dashboard JSON parses"

  images:
    name: images and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the image compose does not
        # The Dockerfile lists every module's pom and source directory by
        # hand, so a new module can build under Maven and fail inside Docker
        # on a clean cache. compose builds three of the four runtime targets;
        # the recovery operator is only ever built by deploy.sh, so without
        # this step nothing in CI would touch it.
        run: |
          docker build -f infrastructure/docker/Dockerfile \
            --target recovery-operator -t fleet-recovery-operator:ci .

      - name: Smoke test the stack
        # This script has said since Phase 7 that it is what Phase 12's CI
        # should run. It builds the images, starts a broker, a gateway and a
        # short-lived fleet, and fails unless the gateway accepted telemetry
        # and the store reports a complete history — ingestion without
        # persistence being a silent gap rather than an error (ADR-007).
        run: ./infrastructure/docker/smoke-test.sh

  publish:
    name: publish images
    # Only a version tag publishes. Merging to main does not, and neither
    # does a manual run: an image in a registry is the one artefact of this
    # pipeline that leaves the machine, so it should correspond to a commit
    # someone deliberately named rather than to whatever main is today.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, scripts, manifests, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to the registry
        env:
          # Through the environment rather than interpolated into the script,
          # so the token is never part of a command line.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Check the tag against the project version
        # Without this, `git tag v2.0.0` publishes images labelled v2.0.0 from
        # a tree whose pom says something else, and the version on the image
        # is a number that appears nowhere in the source that built it.
        run: |
          pom_version=$(python3 -c 'import xml.etree.ElementTree as ET;ns={"m":"http://maven.apache.org/POM/4.0.0"};print(ET.parse("pom.xml").getroot().find("m:version",ns).text)')
          echo "pom version: ${pom_version}, tag: ${GITHUB_REF_NAME}"

          case "$pom_version" in
            *-SNAPSHOT)
              echo "::error::refusing to publish ${pom_version}: a snapshot is by definition not a release. Set a release version in pom.xml before tagging." >&2
              exit 1
              ;;
          esac

          if [ "$GITHUB_REF_NAME" != "v${pom_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pom.xml version ${pom_version} — expected v${pom_version}" >&2
            exit 1
          fi

      - name: Build and push every runtime image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha_tag="sha-${GITHUB_SHA:0:12}"

          # Two tags, and no :latest. The Dockerfile pins its own base images
          # by digest because a moving tag silently changes the JVM under a
          # measurement; publishing a moving tag of our own would hand that
          # same problem to whatever pulls these.
          #
          # The sha tag is immutable: it names the commit that built it. The
          # version tag is only as immutable as the git tag it came from — a
          # force-moved tag would republish over it — which is why the digest
          # is printed below. The digest is the thing to pin against.
          for target in gateway edge-device stream-processor recovery-operator; do
            image="ghcr.io/${repo}/${target}"
            docker build -f infrastructure/docker/Dockerfile --target "$target" \
              -t "${image}:${GITHUB_REF_NAME}" -t "${image}:${sha_tag}" .
            docker push "${image}:${GITHUB_REF_NAME}"
            docker push "${image}:${sha_tag}"

            # Reporting only. A missing RepoDigests must not fail a release
            # whose images are already in the registry.
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' \
              "${image}:${GITHUB_REF_NAME}" 2>/dev/null || true)
            echo "published ${image}:${GITHUB_REF_NAME} ${digest:-(digest unavailable)}"
          done
