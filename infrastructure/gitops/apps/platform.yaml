# The namespace, the shared config, the broker and the gateway — what the
# fleet needs before there is a fleet. Mirrors a bare ./deploy.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-platform
  namespace: argocd
spec:
  project: fleet
  source:
    repoURL: https://github.com/aizen299/self-healing-iot.git
    targetRevision: main
    path: infrastructure/kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet
  syncPolicy:
    automated:
      # prune: a resource deleted from git is deleted from the cluster.
      # selfHeal: a field this manifest declares is put back when something
      # changes it out of band. Fields it does not declare are left to their
      # own manager, which is why deploy.sh's `rollout restart` survives.
      # Both are safe here only because no device Pod is in this
      # Application's path — see project.yaml, which refuses to manage a Pod
      # at all.
      prune: true
      selfHeal: true
    # No CreateNamespace: base/00-namespace.yaml declares the namespace, and a
    # sync option that creates it too would give one resource two owners. On a
    # cluster where it does not exist yet, whichever app runs before the
    # platform app fails once and this retry picks it up in seconds.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
