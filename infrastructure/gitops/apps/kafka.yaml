# Kafka and the stream processor. Mirrors ./deploy.sh --kafka. Downstream of
# detection, never on its path (ADR-009).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-kafka
  namespace: argocd
  annotations:
    # Ordering, not preference. base/00-namespace.yaml declares the namespace
    # everything else is created in, so the platform app has to land first;
    # without a wave the others can be applied against a namespace that does
    # not exist yet and fail their first sync. Argo applies wave 0 to
    # completion before starting wave 1.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: fleet
  source:
    repoURL: https://github.com/aizen299/self-healing-iot.git
    targetRevision: main
    path: infrastructure/kubernetes/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet
  syncPolicy:
    automated:
      # prune: a resource deleted from git is deleted from the cluster.
      # selfHeal: a field this manifest declares is put back when something
      # changes it out of band. Fields it does not declare are left to their
      # own manager, which is why deploy.sh's `rollout restart` survives.
      # Both are safe here only because no device Pod is in this
      # Application's path — see project.yaml, which refuses to manage a Pod
      # at all.
      prune: true
      selfHeal: true
    # No CreateNamespace: base/00-namespace.yaml declares the namespace, and a
    # sync option that creates it too would give one resource two owners. On a
    # cluster where it does not exist yet, whichever app runs before the
    # platform app fails once and this retry picks it up in seconds.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
