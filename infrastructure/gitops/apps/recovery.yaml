# The recovery operator, and the RBAC that lets it replace a pod. Mirrors
# ./deploy.sh --recovery. It is the component that puts a device back —
# which is exactly why Argo must not also be doing that (ADR-016).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-recovery
  namespace: argocd
  annotations:
    # Ordering, not preference. base/00-namespace.yaml declares the namespace
    # everything else is created in, so the platform app has to land first;
    # without a wave the others can be applied against a namespace that does
    # not exist yet and fail their first sync. Argo applies wave 0 to
    # completion before starting wave 1.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: fleet
  source:
    repoURL: https://github.com/aizen299/self-healing-iot.git
    targetRevision: main
    path: infrastructure/kubernetes/recovery
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet
  syncPolicy:
    automated:
      # prune: a resource deleted from git is deleted from the cluster.
      # selfHeal: a field this manifest declares is put back when something
      # changes it out of band. Fields it does not declare are left to their
      # own manager, which is why deploy.sh's `rollout restart` survives.
      # Both are safe here only because no device Pod is in this
      # Application's path — see project.yaml, which refuses to manage a Pod
      # at all.
      prune: true
      selfHeal: true
    # No CreateNamespace: base/00-namespace.yaml declares the namespace, and a
    # sync option that creates it too would give one resource two owners.
    # Ordering is the sync wave's job, not this retry's — the wave is what
    # guarantees the namespace exists before anything is created in it. The
    # retry is here for ordinary transient failures: a repo-server restart, a
    # webhook timeout, an API server that was briefly busy.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
