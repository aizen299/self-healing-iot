# Local development broker. Anonymous access is fine here and is not fine
# anywhere else; authentication belongs with the Kubernetes phase, where
# there is somewhere to keep a secret.
listener 1883
allow_anonymous true

# Off deliberately. Retained presence already outlives a run (ADR-004), and
# persisting it across broker restarts as well would leave the gateway
# reading ghosts from experiments run days earlier.
persistence false

log_dest stdout
log_type warning
log_type error
