# Kafka, and the stream processor that reads it. Applied separately, on
# purpose.
#
# Kafka is by far the heaviest thing in this system — measured at 392 MB
# against 3 MB for Mosquitto — and the Docker VM on this host has under 4 GB
# to divide between kind's control plane and everything else. Nothing on the
# detection path touches Kafka (ADR-009), so the base stack is complete
# without it and this stays out of `kubectl apply -f base/`.
#
#   kubectl apply -f infrastructure/kubernetes/kafka/
#   kubectl -n fleet set env deploy/gateway GATEWAY_KAFKA_ENABLED=true
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fleet
  labels:
    app: kafka
spec:
  # Headless. Kafka advertises a hostname clients must be able to reach
  # directly, and a ClusterIP would hand out a virtual address that the
  # advertised listener does not match.
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fleet
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          # apache/kafka:3.9.0 — the digest compose pins.
          image: apache/kafka@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # Empty host, not 0.0.0.0: the image's storage-format step rejects
            # the literal 0.0.0.0 as a non-routable advertised address.
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # The StatefulSet's stable per-pod DNS name, which is why this is a
            # StatefulSet and not a Deployment: a Deployment's pod name changes
            # on every restart, and Kafka would advertise an address that
            # stopped resolving.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.fleet.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.fleet.svc.cluster.local:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # One broker, so anything above 1 simply fails to create the topic.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # Kafka sizes its heap from the host's memory, which inside a
            # container means it ignores the limit below and gets OOM-killed.
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
