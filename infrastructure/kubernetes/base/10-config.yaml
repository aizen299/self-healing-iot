# Settings more than one workload has to agree on.
#
# Heartbeats ride the telemetry tick (ADR-006), so the gateway's expected
# interval and the fleet's publish interval must be the same number. Compose
# expressed that with a YAML anchor, which is a build-time substitution: the
# two containers still received two independent literals, and nothing stopped
# them drifting once the file had been rendered.
#
# A ConfigMap is stronger. Both workloads read the same key from the same
# object at run time, so changing the tick changes it for both or for neither.
#
# Only values with more than one reader belong here. A key nothing consumes is
# worse than no key at all: it looks like the source of truth for something,
# so changing it looks like it will take effect. The fleet id lives on the pod
# labels, which is where the recovery operator selects on it, and therefore
# not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-config
  namespace: fleet
  labels:
    app.kubernetes.io/part-of: self-healing-fleet
data:
  # The one value the gateway and the devices must not disagree about.
  TICK_INTERVAL_MS: "1000"

  # In-cluster DNS. The broker Service is `broker` in this namespace.
  MQTT_BROKER_URL: tcp://broker:1883
---
# Everything identical across the device pods, so a change lands on the whole
# fleet at once. Three pods differing only by accident would not crash — they
# would quietly run three different configurations while `kubectl get pods`
# showed a uniform fleet, and the devices are supposed to be running one
# deterministic workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-device-config
  namespace: fleet
  labels:
    app.kubernetes.io/part-of: self-healing-fleet
data:
  FLEET_SINK: mqtt
  FLEET_DEVICE_COUNT: "1"
  # Read by the devices, and by the recovery operator, which has to recover a
  # device's index from its id to give a replacement the right slice of the
  # fleet. Stated rather than left to the default so the two cannot disagree.
  FLEET_DEVICE_ID_PREFIX: device
  FLEET_VARIANT: constrained
  # Long rather than a timed run. A device that exits partway through looks
  # exactly like the failure this system detects, and nothing on screen would
  # distinguish that from a bug.
  FLEET_RUN_DURATION_SECONDS: "86400"
  # Stated, not defaulted: the heap cap is Pillar A's independent variable and
  # never belongs in an image.
  JAVA_OPTS: -Xmx64m
